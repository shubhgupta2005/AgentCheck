name: Daily crawl

on:
  schedule:
    - cron: "17 1 * * *" # 06:47 IST, daily
  workflow_dispatch: {}

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Crawl sources into Supabase
        run: npm run crawl
        env:
          REQUIRE_SUPABASE: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
